[project]
name = "cutroom"
version = "0.2.0"
description = "Cut silences and retakes from talking recordings: Screen Studio projects and plain video files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # apple silicon transcribes with mlx (metal); everything else with faster-whisper (ctranslate2)
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
# adds the faster-whisper backend on apple silicon too (cross-backend testing)
faster-whisper = ["faster-whisper>=1.1"]

[project.scripts]
cutroom = "cutroom.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
